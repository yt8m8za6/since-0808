<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="仲良しふたりの今までとこれから💐">
  <title>since 0808-谷井田⇔大山🤍❤</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #fffaf7 0%, #fceff1 100%);
      color: #594b4b;
      text-align: center;
    }
    .container {
      width: min(92%, 500px);
      margin: 0 auto;
      padding: 45px 0 60px;
    }
    .photo-trigger {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0 0 28px;
      border: 0;
      border-radius: 24px;
      background: transparent;
      box-shadow: 0 5px 20px rgba(120,80,80,0.10);
      overflow: hidden;
      cursor: pointer;
    }
    .photo-trigger:focus-visible { outline: 3px solid #a6777e; outline-offset: 4px; }
    .top-photo {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 24px;
    }
    .falling-emoji {
      position: fixed;
      top: 0;
      z-index: 20;
      pointer-events: none;
      user-select: none;
      line-height: 1;
      animation: emoji-fall var(--duration) ease-in var(--delay) both;
    }
    @keyframes emoji-fall {
      from { opacity: 0; transform: translate3d(0, -45px, 0) rotate(-20deg); }
      12% { opacity: 1; }
      85% { opacity: 1; }
      to { opacity: 0; transform: translate3d(var(--drift), calc(100vh + 60px), 0) rotate(45deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .falling-emoji { animation: emoji-glow 0.7s ease-out both; }
      @keyframes emoji-glow {
        from { opacity: 0; transform: scale(0.6); }
        45% { opacity: 1; transform: scale(1.2); }
        to { opacity: 0; transform: scale(1); }
      }
    }
    h1 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: clamp(22px, 6vw, 36px);
      color: #8f6d72;
    }
    .welcome { margin-bottom: 35px; font-size: 14px; color: #9b8585; }
    .counter-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }
    .counter {
      background: rgba(255,255,255,0.8);
      padding: 22px 10px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(120,80,80,0.08);
    }
    .counter-title { font-size: 12px; color: #aa8c8c; margin-bottom: 8px; }
    .days { font-family: Georgia, serif; font-size: 30px; color: #9c747a; }
    .days-label { font-size: 10px; letter-spacing: 2px; color: #bca4a4; }
    .counter-date {
      display: block;
      margin-top: 9px;
      font-family: Georgia, serif;
      font-size: 12px;
      color: #aa8c8c;
    }
    .card {
      background: rgba(255,255,255,0.85);
      border-radius: 24px;
      padding: 25px 20px;
      margin: 15px 0;
      box-shadow: 0 5px 20px rgba(120,80,80,0.08);
    }
    .card h2 { margin-top: 0; font-size: 17px; font-weight: normal; }
    button {
      border: none;
      background: #d8aeb4;
      color: white;
      padding: 13px 24px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.65; cursor: default; }
    #fortuneResult { margin: 20px 0 0; line-height: 1.8; min-height: 25px; }
    .fortune-name { font-size: 20px; color: #a6777e; font-weight: bold; }
    .ring-area { margin-top: 40px; }
    .ring {
      font-size: 38px;
      cursor: pointer;
      display: inline-block;
      transition: 0.3s;
      user-select: none;
    }
    .ring:active { transform: scale(1.3) rotate(10deg); }
    .hint { font-size: 10px; color: #c7b5b5; margin-top: 5px; letter-spacing: 1px; }
    .secret {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(78, 59, 62, 0.88);
      align-items: center;
      justify-content: center;
      padding: 30px;
      z-index: 10;
    }
    .secret-box {
      width: min(100%, 400px);
      background: #fffaf7;
      border-radius: 28px;
      padding: 40px 25px;
      animation: appear 0.7s ease;
    }
    .secret-rings { font-size: 42px; margin-bottom: 20px; }
    .secret-message { line-height: 2; color: #765e62; font-size: 15px; }
    .close {
      margin-top: 25px;
      background: transparent;
      color: #aa858b;
      border: 1px solid #d8b9bd;
    }
    @keyframes appear {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    footer {
      margin-top: 40px;
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: #c1aaaa;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>since 0808-谷井田⇔大山</h1>
    <button type="button" class="photo-trigger" id="photoTrigger" aria-label="ふたりの写真。タップすると絵文字が降るよ">
      <img src="top.jpg" alt="ふたりの思い出" class="top-photo">
    </button>
    <div class="welcome">仲良しふたりの今までとこれから💐</div>
    <section class="counter-area">
      <div class="counter">
        <div class="counter-title">出会ってから</div>
        <div class="days" id="meetDays">0</div>
        <div class="days-label">DAYS</div>
        <time class="counter-date" datetime="2022-08-08">2022.08.08</time>
      </div>
      <div class="counter">
        <div class="counter-title">付き合ってから</div>
        <div class="days" id="loveDays">0</div>
        <div class="days-label">DAYS</div>
        <time class="counter-date" datetime="2022-09-09">2022.09.09</time>
      </div>
    </section>
    <section class="card">
      <h2>今日の運勢🔮</h2>
      <p>1日1回の運試し🌟</p>
      <button type="button" id="fortuneButton" onclick="drawFortune()">引いてみる！</button>
      <div id="fortuneResult"></div>
    </section>
    <div class="ring-area">
      <div class="ring" onclick="openSecret()">💍</div>
      <div class="hint">OUR PROMISE</div>
    </div>
    <footer>2022.08.08 — FOREVER</footer>
  </main>
  <div class="secret" id="secret">
    <div class="secret-box">
      <div class="secret-rings">💍 ♡ 💍</div>
      <div class="secret-message">
        たくさん笑って、たくさん話して、<br>
        これからもふたりらしくいようね。<br><br>
        今日も一緒にいてくれてありがとう！
      </div>
      <button type="button" class="close" onclick="closeSecret()">もどる</button>
    </div>
  </div>
  <script>
    const meetDate = new Date(2022, 7, 8);
    const loveDate = new Date(2022, 8, 9);

    function calculateDays(startDate) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
    }

    document.getElementById("meetDays").textContent =
      calculateDays(meetDate).toLocaleString();
    document.getElementById("loveDays").textContent =
      calculateDays(loveDate).toLocaleString();

    const photoTrigger = document.getElementById("photoTrigger");
    const photoEmojis = ["💐", "🤍", "🩷", "🌟", "💍", "✨"];
    photoTrigger.addEventListener("click", () => {
      const bounds = photoTrigger.getBoundingClientRect();
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      for (let i = 0; i < (reducedMotion ? 8 : 24); i++) {
        const piece = document.createElement("span");
        piece.className = "falling-emoji";
        piece.textContent = photoEmojis[Math.floor(Math.random() * photoEmojis.length)];
        piece.setAttribute("aria-hidden", "true");
        piece.style.left = `${bounds.left + Math.random() * bounds.width}px`;
        piece.style.fontSize = `${18 + Math.random() * 15}px`;
        piece.style.setProperty("--drift", `${Math.random() * 100 - 50}px`);
        piece.style.setProperty("--delay", `${reducedMotion ? 0 : Math.random() * 0.7}s`);
        piece.style.setProperty("--duration", `${2.5 + Math.random() * 1.2}s`);
        piece.addEventListener("animationend", () => piece.remove(), { once: true });
        document.body.appendChild(piece);
      }
    });

    const fortunes = [
      { name: "大吉", message: "最高の運勢！良いことしかない✌" },
      { name: "中吉", message: "かなり良い感じ！電車で頭ゴツンしない😆" },
      { name: "中吉", message: "結構良い運勢✨️定時を過ぎても起きてられるかも！？😳" },
      { name: "吉", message: "ぼちぼち良い感じ！山田さんから面白いことが聞けるかも🤭" },
      { name: "吉", message: "そこそこ良い運勢！ベッドでポテチ食べてもこぼさない😤" },
      { name: "超大吉💮", message: "生きてるだけで大優勝💐恋人に何かおねだりしてみよう😆" },
      { name: "凶", message: "ヤバい😱寝る前のおトイレを忘れずに😖🚽" }
    ];

    const fortuneStorageKey = "since0808-fortune-v1";
    const fortuneButton = document.getElementById("fortuneButton");
    const fortuneResult = document.getElementById("fortuneResult");

    function fortuneDay() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date());
    }

    function savedFortune() {
      try { return JSON.parse(localStorage.getItem(fortuneStorageKey) || "null"); }
      catch { return null; }
    }

    function showFortune(fortune) {
      fortuneResult.replaceChildren();
      const name = document.createElement("div");
      name.className = "fortune-name";
      name.textContent = fortune.name;
      fortuneResult.append(name, document.createTextNode(fortune.message));
      fortuneButton.disabled = true;
      fortuneButton.textContent = "今日はもう引いたよ🌟";
    }

    function refreshFortune() {
      const saved = savedFortune();
      if (saved && saved.day === fortuneDay() &&
          Number.isInteger(saved.index) && fortunes[saved.index]) {
        showFortune(fortunes[saved.index]);
      } else {
        fortuneResult.replaceChildren();
        fortuneButton.disabled = false;
        fortuneButton.textContent = "引いてみる！";
      }
    }

    function drawFortune() {
      if (savedFortune()?.day === fortuneDay()) return;
      const index = Math.floor(Math.random() * fortunes.length);
      try {
        localStorage.setItem(fortuneStorageKey, JSON.stringify({ day: fortuneDay(), index }));
      } catch {
        fortuneResult.textContent = "保存できなかったよ。ブラウザーの設定を確認してね。";
        return;
      }
      showFortune(fortunes[index]);
    }

    refreshFortune();
    setInterval(refreshFortune, 60000);

    function openSecret() {
      document.getElementById("secret").style.display = "flex";
    }
    function closeSecret() {
      document.getElementById("secret").style.display = "none";
    }
  </script>
</body>
</html>
