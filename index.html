<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="仲良しふたりの今までとこれから💐">
  <title>since 0808-ふたりの今までとこれから</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #fffaf7 0%, #fceff1 100%);
      color: #594b4b;
      text-align: center;
    }
    .container {
      width: min(92%, 500px);
      margin: 0 auto;
      padding: 45px 0 60px;
    }
    .photo-trigger {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0 0 28px;
      border: 0;
      border-radius: 24px;
      background: transparent;
      box-shadow: 0 5px 20px rgba(120,80,80,0.10);
      overflow: hidden;
      cursor: pointer;
    }
    .photo-trigger:focus-visible { outline: 3px solid #a6777e; outline-offset: 4px; }
    .top-photo {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 24px;
    }
    .falling-emoji {
      position: fixed;
      top: 0;
      z-index: 20;
      pointer-events: none;
      user-select: none;
      line-height: 1;
      animation: emoji-fall var(--duration) ease-in var(--delay) both;
    }
    @keyframes emoji-fall {
      from { opacity: 0; transform: translate3d(0, -45px, 0) rotate(-20deg); }
      12% { opacity: 1; }
      85% { opacity: 1; }
      to { opacity: 0; transform: translate3d(var(--drift), calc(100vh + 60px), 0) rotate(45deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .falling-emoji { animation: emoji-glow 0.7s ease-out both; }
      @keyframes emoji-glow {
        from { opacity: 0; transform: scale(0.6); }
        45% { opacity: 1; transform: scale(1.2); }
        to { opacity: 0; transform: scale(1); }
      }
    }
    h1 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 36px;
      color: #8f6d72;
    }
    .welcome { margin-bottom: 35px; font-size: 14px; color: #9b8585; }
    .counter-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }
    .counter {
      background: rgba(255,255,255,0.8);
      padding: 22px 10px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(120,80,80,0.08);
    }
    .counter-title { font-size: 12px; color: #aa8c8c; margin-bottom: 8px; }
    .days { font-family: Georgia, serif; font-size: 30px; color: #9c747a; }
    .days-label { font-size: 10px; letter-spacing: 2px; color: #bca4a4; }
    .counter-date {
      display: block;
      margin-top: 9px;
      font-family: Georgia, serif;
      font-size: 12px;
      color: #aa8c8c;
    }
    .card {
      background: rgba(255,255,255,0.85);
      border-radius: 24px;
      padding: 25px 20px;
      margin: 15px 0;
      box-shadow: 0 5px 20px rgba(120,80,80,0.08);
    }
    .card h2 { margin-top: 0; font-size: 17px; font-weight: normal; }
    .today-anniversary {
      margin: 10px 0 0;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: clamp(15px, 3.8vw, 19px);
      line-height: 1.7;
      color: #9c747a;
    }
    .fortune-hint { font-size: 13px; color: #9b8585; }
    button {
      border: none;
      background: #d8aeb4;
      color: white;
      padding: 13px 24px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.65; cursor: default; }
    #fortuneResult { margin: 20px 0 0; line-height: 1.8; min-height: 25px; }
    .fortune-name { font-size: 20px; color: #a6777e; font-weight: bold; }
    .ring-area { margin-top: 40px; }
    .ring {
      font-size: 38px;
      cursor: pointer;
      display: inline-block;
      transition: 0.3s;
      user-select: none;
    }
    .ring:active { transform: scale(1.3) rotate(10deg); }
    .hint { font-size: 10px; color: #c7b5b5; margin-top: 5px; letter-spacing: 1px; }
    .secret {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(78, 59, 62, 0.88);
      align-items: center;
      justify-content: center;
      padding: 30px;
      z-index: 10;
    }
    .secret-box {
      width: min(100%, 400px);
      background: #fffaf7;
      border-radius: 28px;
      padding: 40px 25px;
      animation: appear 0.7s ease;
    }
    .secret-rings { font-size: 42px; margin-bottom: 20px; }
    .secret-message { line-height: 2; color: #765e62; font-size: 15px; }
    .close {
      margin-top: 25px;
      background: transparent;
      color: #aa858b;
      border: 1px solid #d8b9bd;
    }
    @keyframes appear {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    footer {
      margin-top: 40px;
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: #c1aaaa;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>since 0808</h1>
    <button type="button" class="photo-trigger" id="photoTrigger" aria-label="ふたりの写真。タップすると絵文字が降るよ">
      <img src="top.jpg" alt="ふたりの思い出" class="top-photo">
    </button>
    <div class="welcome">仲良しふたりの今までとこれから💐</div>
    <section class="counter-area">
      <div class="counter">
        <div class="counter-title">出会ってから</div>
        <div class="days" id="meetDays">0</div>
        <div class="days-label">DAYS</div>
        <time class="counter-date" datetime="2022-08-08">2022.08.08</time>
      </div>
      <div class="counter">
        <div class="counter-title">付き合ってから</div>
        <div class="days" id="loveDays">0</div>
        <div class="days-label">DAYS</div>
        <time class="counter-date" datetime="2022-09-08">2022.09.08</time>
      </div>
    </section>
    <section class="card" aria-labelledby="today-title">
      <h2 id="today-title">今日は何の日？🗓️</h2>
      <p class="today-anniversary" id="todayAnniversary" role="status"></p>
    </section>
    <section class="card">
      <h2>今日の運勢🔮</h2>
      <p class="fortune-hint">1日1回の運試し🌟結果は全10種類以上！？</p>
      <button type="button" id="fortuneButton" onclick="drawFortune()">引いてみる！</button>
      <div id="fortuneResult"></div>
    </section>
    <div class="ring-area">
      <div class="ring" onclick="openSecret()">💍</div>
      <div class="hint">OUR PROMISE</div>
    </div>
    <footer>2022.08.08 — FOREVER</footer>
  </main>
  <div class="secret" id="secret">
    <div class="secret-box">
      <div class="secret-rings">💍 ♡ 💍</div>
      <div class="secret-message">
        たくさん笑って、たくさん話して、<br>
        これからもふたりらしくいようね。<br><br>
        今日も一緒にいてくれてありがとう！
      </div>
      <button type="button" class="close" onclick="closeSecret()">もどる</button>
    </div>
  </div>
  <script>
    const meetDate = new Date(2022, 7, 8);
    const loveDate = new Date(2022, 8, 8);

    function calculateDays(startDate) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
    }

    document.getElementById("meetDays").textContent =
      calculateDays(meetDate).toLocaleString();
    document.getElementById("loveDays").textContent =
      calculateDays(loveDate).toLocaleString();

    const dailyAnniversaries = ["元日","書き初め","ひとみの日","石の日","いちごの日","色の日","七草","イヤホンの日","とんちの日","110番の日","鏡開き","成人の日","咸臨丸出航記念日","愛と希望と勇気の日","半襟の日","禁酒の日","防災とボランティアの日","都バスの日","家庭用消火器点検の日","海外団体旅行の日","料理番組の日","カレーの日","電子メールの日","法律扶助の日","日本最低気温の日","文化財防火デー","国旗制定記念日","衣類乾燥機の日","タウン情報の日","3分間電話の日","生命保険の日","テレビ放送記念日","お麩の日","節分","立春","プロ野球の日","海苔の日","北方領土の日","針供養","ふくの日","ふきのとうの日","建国記念の日","レトルトカレーの日","苗字制定記念日","バレンタインデー","春一番名づけの日","天気図記念日","天使の囁き記念日","嫌煙運動の日","雨水","アレルギーの日","日刊新聞創刊の日","猫の日","天皇誕生日","月光仮面登場の日","夕刊紙の日","脱出の日","冬の恋人の日","ビスケットの日","うるう日","ビキニ・デー","ミニチュアの日","ひな祭り","ミシンの日","サンゴの日","世界一周記念日","消防記念日","みつばちの日","雑穀の日","サボテンの日","おくる防災の日","サイフの日","青函トンネル開業記念日","ホワイトデー","靴の日","国立公園指定記念日","漫画週刊誌の日","点字ブロックの日","ミュージックの日","春分の日","国際人種差別撤廃デー","世界水の日","世界気象デー","世界結核デー","電気記念日","カチューシャの唄の日","さくらの日","三つ葉の日","マリモの日","旧国立競技場落成記念日","教育基本法・学校教育法公布の日","トレーニングの日","国際子どもの本の日","日本橋開通記念日","あんぱんの日","デビューの日","新聞をヨム日","世界保健デー","タイヤの日","大仏の日","駅弁の日","メートル法公布記念日","パンの記念日","喫茶店の日","オレンジデー","ヘリコプターの日","女子マラソンの日","恐竜の日","発明の日","地図の日","郵政記念日","民放の日","アースデイ","世界図書・著作権デー","植物学の日","歩道橋の日","世界知的所有権の日","婦人警官記念日","サンフランシスコ平和条約発効記念日","昭和の日","図書館記念日","日本赤十字社創立記念日","歯科医師記念日","憲法記念日","みどりの日","こどもの日","コロッケの日","コナモンの日","ゴーヤーの日","黒板の日","母の日","長良川鵜飼開き","海上保安の日","メイストームデー","温度計の日","沖縄本土復帰記念日","旅の日","世界電気通信の日","18リットル缶の日","ボクシングの日","東京港開港記念日","小学校開校の日","国際生物多様性の日","キスの日","ゴルフ場記念日","広辞苑の日","東名高速道路全通記念日","百人一首の日","ゴルフ記念日","こんにゃくの日","消費者の日","世界禁煙デー","電波の日","横浜港開港記念日","測量の日","ローメンの日","環境の日","楽器の日","緑内障を考える日","学校の安全確保・安全管理の日","我が家のカギを見直すロックの日","時の記念日","傘の日","恋人の日","小さな親切の日","世界献血者デー","暑中見舞いの日","和菓子の日","薩摩の日","海外移住の日","朗読の日","世界難民の日","父の日","かにの日","沖縄慰霊の日","空飛ぶ円盤記念日","住宅デー","露天風呂の日","ちらし寿司の日","貿易記念日","佃煮の日","トランジスタの日","童謡の日","うどんの日","ソフトクリームの日","梨の日","農林水産省発足記念日","公認会計士の日","七夕","チキン南蛮の日","ジェットコースター記念日","納豆の日","養殖真珠発明記念日","人間ドックの日","日本標準時制定記念日","ゼリーの日","ファミコンの日","国土交通Day","漫画の日","ネルソン・マンデラ国際デー","女性大臣の日","海の日","日本三景の日","下駄の日","文月ふみの日","劇画の日","かき氷の日","幽霊の日","スイカの日","菜っ葉の日","アマチュア無線の日","プロレス記念日","蓄音機の日","水の日","ハーブの日","はちみつの日","橋の日","タクシーの日","広島平和記念日","鼻の日","そろばんの日","長崎原爆の日","道の日","山の日","太平洋横断記念日","函館夜景の日","専売特許の日","終戦記念日","電子コミックの日","プロ野球ナイター記念日","高校野球記念日","バイクの日","交通信号の日","献血の日","チンチン電車の日","白虎隊の日","歯ブラシの日","即席ラーメン記念日","ユースホステルの日","「男はつらいよ」の日","民放テレビスタートの日","焼き肉の日","ハッピーサンシャインデー","野菜の日","防災の日","宝くじの日","グミの日","くしの日","クリーン・コール・デー","黒豆の日","クリーナーの日","国際識字デー","救急の日","下水道の日","警察相談の日","宇宙の日","世界の法の日","メンズバレンタインデー","スカウトの日","国際オゾン層保護デー","モノレール開業記念日","かいわれ大根の日","苗字の日","空の日","敬老の日","孤児院の日","秋分の日","歯科技工士記念日","10円カレーの日","ワープロ記念日","世界観光の日","パソコンの日","クリーニングの日","クレーンの日","コーヒーの日","豆腐の日","登山の日","イワシの日","時刻表記念日","国際協力の日","ミステリー記念日","骨と関節の日","塾の日","釣りの日","安全・安心なまちづくりの日","豆乳の日","スポーツの日","鉄道の日","きのこの日","世界食料デー","貯蓄の日","統計の日","海外旅行の日","新聞広告の日","国際反戦デー","平安遷都の日","電信電話記念日","国連デー","世界パスタデー","柿の日","テディベアズ・デー","速記記念日","おしぼりの日","初恋の日","ハロウィーン","寿司の日","キッチン・バスの日","文化の日","ユネスコ憲章記念日","いいりんごの日","アパート記念日","鍋の日","いい歯の日","119番の日","エレベーターの日","サッカーの日","皮膚の日","うるしの日","世界糖尿病デー","七五三","いいいろ塗装の日","将棋の日","土木の日","農業協同組合法公布記念日","世界子どもの日","世界テレビ・デー","いい夫婦の日","勤労感謝の日","鰹節の日","OLの日","いい風呂の日","ノーベル賞制定記念日","税関記念日","いい肉の日","本みりんの日","映画の日","日本人宇宙飛行記念日","国際障害者デー","破傷風血清療法の日","国際ボランティアデー","音の日","クリスマスツリーの日","太平洋戦争開戦日","障害者の日","世界人権デー","胃腸の日","漢字の日","ビタミンの日","南極の日","観光バス記念日","紙の記念日","飛行機の日","国連加盟記念日","日本初飛行の日","ブリの日","遠距離恋愛の日","冬至","東京タワー完成の日","クリスマス・イブ","クリスマス","プロ野球誕生の日","ピーターパンの日","ディスクジョッキーの日","清水トンネル貫通記念日","地下鉄開業の日","大みそか"];

    function updateAnniversary() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "numeric", day: "numeric"
      }).formatToParts(new Date());
      const value = type => Number(parts.find(part => part.type === type).value);
      const year = value("year");
      const month = value("month");
      const day = value("day");
      const label = document.getElementById("todayAnniversary");
      if (day === 8 && (year > 2022 || month >= 9)) {
        const metMonths = (year - 2022) * 12 + month - 8;
        const loveMonths = (year - 2022) * 12 + month - 9;
        label.textContent = `出会って${metMonths}ヶ月＆付き合って${loveMonths}ヶ月💖`;
      } else {
        const dayIndex = Math.round((Date.UTC(2024, month - 1, day) - Date.UTC(2024, 0, 1)) / 86400000);
        label.textContent = `${month}月${day}日は${dailyAnniversaries[dayIndex]}✨️`;
      }
    }
    updateAnniversary();
    setInterval(updateAnniversary, 60000);

    const photoTrigger = document.getElementById("photoTrigger");
    const photoEmojis = ["💐", "🤍", "🩷", "🌟", "💍", "✨"];
    photoTrigger.addEventListener("click", () => {
      const bounds = photoTrigger.getBoundingClientRect();
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      for (let i = 0; i < (reducedMotion ? 8 : 24); i++) {
        const piece = document.createElement("span");
        piece.className = "falling-emoji";
        piece.textContent = photoEmojis[Math.floor(Math.random() * photoEmojis.length)];
        piece.setAttribute("aria-hidden", "true");
        piece.style.left = `${bounds.left + Math.random() * bounds.width}px`;
        piece.style.fontSize = `${18 + Math.random() * 15}px`;
        piece.style.setProperty("--drift", `${Math.random() * 100 - 50}px`);
        piece.style.setProperty("--delay", `${reducedMotion ? 0 : Math.random() * 0.7}s`);
        piece.style.setProperty("--duration", `${2.5 + Math.random() * 1.2}s`);
        piece.addEventListener("animationend", () => piece.remove(), { once: true });
        document.body.appendChild(piece);
      }
    });

    const fortunes = [
      { name: "大吉", message: "最高の運勢！良いことしかない✌" },
      { name: "中吉", message: "かなり良い感じ！電車で頭ゴツンしない😆" },
      { name: "中吉", message: "結構良い運勢✨️定時を過ぎても起きてられるかも！？😳" },
      { name: "吉", message: "ぼちぼち良い感じ！山田さんから面白いことが聞けるかも🤭" },
      { name: "吉", message: "そこそこ良い運勢！ベッドでポテチ食べてもこぼさない😤" },
      { name: "超大吉💮", message: "生きてるだけで大優勝💐恋人に何かおねだりしてみよう😆" },
      { name: "凶", message: "ヤバい😱寝る前のおトイレを忘れずに😖🚽" },
      { name: "凶", message: "気を付けて😱カナガワの外に大山からの刺客がいるかも🤭" },
      { name: "小吉", message: "ちょっといまいい？でもれおちがご飯モリモリ食べるかも🐶" },
      { name: "中吉", message: "良い運勢🎀欲しかったものがZOZOで安くなってるかも！？" },
      { name: "小吉", message: "疲れ気味？でも大丈夫🍵こんなときはスパダリがいつもより優しいよ😆" }
    ];

    const fortuneStorageKey = "since0808-fortune-v1";
    const fortuneButton = document.getElementById("fortuneButton");
    const fortuneResult = document.getElementById("fortuneResult");

    function fortuneDay() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date());
    }

    function savedFortune() {
      try { return JSON.parse(localStorage.getItem(fortuneStorageKey) || "null"); }
      catch { return null; }
    }

    function showFortune(fortune) {
      fortuneResult.replaceChildren();
      const name = document.createElement("div");
      name.className = "fortune-name";
      name.textContent = fortune.name;
      fortuneResult.append(name, document.createTextNode(fortune.message));
      fortuneButton.disabled = true;
      fortuneButton.textContent = "今日はもう引いたよ🌟";
    }

    function refreshFortune() {
      const saved = savedFortune();
      if (saved && saved.day === fortuneDay() &&
          Number.isInteger(saved.index) && fortunes[saved.index]) {
        showFortune(fortunes[saved.index]);
      } else {
        fortuneResult.replaceChildren();
        fortuneButton.disabled = false;
        fortuneButton.textContent = "引いてみる！";
      }
    }

    function drawFortune() {
      if (savedFortune()?.day === fortuneDay()) return;
      const index = Math.floor(Math.random() * fortunes.length);
      try {
        localStorage.setItem(fortuneStorageKey, JSON.stringify({ day: fortuneDay(), index }));
      } catch {
        fortuneResult.textContent = "保存できなかったよ。ブラウザーの設定を確認してね。";
        return;
      }
      showFortune(fortunes[index]);
    }

    refreshFortune();
    setInterval(refreshFortune, 60000);

    function openSecret() {
      document.getElementById("secret").style.display = "flex";
    }
    function closeSecret() {
      document.getElementById("secret").style.display = "none";
    }
  </script>
</body>
</html>
